name: CD Azure

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Azure VM
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          SSH_HOST: ${{ secrets.AZURE_VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Desplegar en Azure
        env:
          SSH_HOST: ${{ secrets.AZURE_VM_HOST }}
          SSH_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e

            cd /home/azureuser/proyecto-riesgo-incendios-valparaiso

            git fetch origin main
            git reset --hard origin/main

            # Validar la configuración de Nginx antes del despliegue
            docker compose -f docker-compose.cloud.yml run --rm --no-deps nginx nginx -t

            # Actualizar toda la aplicación
            docker compose -f docker-compose.cloud.yml up -d --build --remove-orphans

            # Recrear Nginx para aplicar cambios en archivos montados
            docker compose -f docker-compose.cloud.yml up -d --no-deps --force-recreate nginx

            # Mostrar estado final
            docker compose -f docker-compose.cloud.yml ps
          EOF
