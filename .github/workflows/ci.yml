name: CI

on:
  push:
    branches:
      - main
      - etl-v2
      - security-hardening

  pull_request:
    branches:
      - main
      - etl-v2
      - security-hardening

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  # =========================================================
  # SEGURIDAD - BUSQUEDA DE SECRETOS
  # =========================================================

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Buscar secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # =========================================================
  # PYTHON
  # =========================================================

  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Actualizar pip
        run: |
          python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Verificar dependencias
        run: |
          pip check

      - name: Instalar auditor de seguridad
        run: |
          pip install pip-audit

      - name: Auditar dependencias Python
        run: |
          pip-audit -r requirements.txt

      - name: Validar sintaxis Python
        run: |
          python -m compileall src scripts


  # =========================================================
  # FRONTEND
  # =========================================================

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: |
          npm ci

      - name: Ejecutar lint
        run: |
          npm run lint

      - name: Auditar dependencias npm
        run: |
          npm audit --audit-level=high

      - name: Construir React
        run: |
          npm run build


  # =========================================================
  # DOCKER
  # =========================================================

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - python
      - frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Data Service
        run: |
          docker build \
            -f src/services/data-service/Dockerfile \
            -t proyecto-incendios-data-service:ci \
            .

      - name: Build API Gateway
        run: |
          docker build \
            -f src/services/api-gateway/Dockerfile \
            -t proyecto-incendios-api-gateway:ci \
            .

      - name: Build AI Service
        run: |
          docker build \
            -f src/services/ai-service/Dockerfile \
            -t proyecto-incendios-ai-service:ci \
            .

      - name: Build Frontend
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t proyecto-incendios-frontend:ci \
            .

      # Risk Service se incorporara cuando el CI pueda
      # descargar el modelo .joblib desde almacenamiento
      # externo, por ejemplo Amazon S3.