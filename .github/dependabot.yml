version: 2

updates:

  # =========================================================
  # PYTHON
  # =========================================================

  - package-ecosystem: "pip"
    directory: "/"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 5

    # El proyecto utiliza Python 3.11.
    # SHAP >= 0.52 requiere Python >= 3.12.
    ignore:
      - dependency-name: "shap"
        versions:
          - ">=0.52.0"


  # =========================================================
  # FRONTEND NPM
  # =========================================================

  - package-ecosystem: "npm"
    directory: "/frontend"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 5

    # Evitar saltos de versión mayor automáticos.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"


  # =========================================================
  # GITHUB ACTIONS
  # =========================================================

  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 5


  # =========================================================
  # DATA SERVICE - DOCKER
  # =========================================================

  - package-ecosystem: "docker"
    directory: "/src/services/data-service"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 3

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"


  # =========================================================
  # RISK SERVICE - DOCKER
  # =========================================================

  - package-ecosystem: "docker"
    directory: "/src/services/risk-service"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 3

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"


  # =========================================================
  # API GATEWAY - DOCKER
  # =========================================================

  - package-ecosystem: "docker"
    directory: "/src/services/api-gateway"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 3

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"


  # =========================================================
  # AI SERVICE - DOCKER
  # =========================================================

  - package-ecosystem: "docker"
    directory: "/src/services/ai-service"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 3

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"


  # =========================================================
  # FRONTEND - DOCKER
  # =========================================================

  - package-ecosystem: "docker"
    directory: "/frontend"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 3

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"