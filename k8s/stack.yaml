# =========================================================
# API GATEWAY
# =========================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api-gateway

          image: proyecto-incendios-api-gateway:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

          env:
            - name: DATA_SERVICE_URL
              value: http://data-service:8001

            - name: RISK_SERVICE_URL
              value: http://risk-service:8002

            - name: AI_SERVICE_URL
              value: http://ai-service:8003

            - name: REPORT_SERVICE_URL
              value: http://report-service:8004

            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: incendios-secrets
                  key: ADMIN_USERNAME

            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: incendios-secrets
                  key: ADMIN_PASSWORD_HASH

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: incendios-secrets
                  key: JWT_SECRET

            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: "60"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway

spec:
  selector:
    app: api-gateway

  ports:
    - port: 8000
      targetPort: 8000


# =========================================================
# FRONTEND REACT
# =========================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend

          image: proyecto-incendios-frontend:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 3
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: frontend

spec:
  selector:
    app: frontend

  ports:
    - port: 80
      targetPort: 80


# =========================================================
# NGINX
# =========================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config

data:

  default.conf: |

    upstream frontend {
        server frontend:80;
    }

    upstream api_gateway {
        server api-gateway:8000;
    }

    server {

        listen 80;

        client_max_body_size 12m;

        location /api/ {

            proxy_pass http://api_gateway/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {

            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /nginx-health {

            access_log off;

            return 200 "ok\n";

            add_header Content-Type text/plain;
        }
    }


# =========================================================
# NGINX DEPLOYMENT
# =========================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:

      containers:
        - name: nginx

          image: nginx:alpine

          ports:
            - containerPort: 80

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80

            initialDelaySeconds: 3
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 20

      volumes:
        - name: nginx-config

          configMap:
            name: nginx-config


# =========================================================
# NGINX SERVICE
# =========================================================

---
apiVersion: v1
kind: Service
metadata:
  name: nginx

spec:
  type: NodePort

  selector:
    app: nginx

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080


# =========================================================
# AUTOSCALADO API GATEWAY
# =========================================================

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa

spec:

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 50


