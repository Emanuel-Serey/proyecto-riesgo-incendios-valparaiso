# =========================================================
# DATA SERVICE
# =========================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: data-service

  template:
    metadata:
      labels:
        app: data-service

    spec:

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: data-service

          image: proyecto-incendios-data-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8001

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

          env:
            - name: DB_HOST
              value: host.docker.internal

            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: incendios-secrets
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: incendios-secrets
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: incendios-secrets
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: incendios-secrets
                  key: DB_PASSWORD

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 8001

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8001

            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: data-service

spec:
  selector:
    app: data-service

  ports:
    - port: 8001
      targetPort: 8001


# =========================================================
# RISK SERVICE
# =========================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: risk-service

  template:
    metadata:
      labels:
        app: risk-service

    spec:

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: risk-service

          image: proyecto-incendios-risk-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8002

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

          env:
            - name: DB_HOST
              value: host.docker.internal

            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: incendios-secrets
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: incendios-secrets
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: incendios-secrets
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: incendios-secrets
                  key: DB_PASSWORD

            - name: MODELO_VERSION
              value: random_forest_v1

