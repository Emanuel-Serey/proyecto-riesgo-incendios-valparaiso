# =========================================================
# PROMETHEUS CONFIG
# =========================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:

    - job_name: "api-gateway"
      metrics_path: /metrics
      static_configs:
        - targets:
            - "api-gateway:8000"


    - job_name: "data-service"
      metrics_path: /metrics
      static_configs:
        - targets:
            - "data-service:8001"


    - job_name: "risk-service"
      metrics_path: /metrics
      static_configs:
        - targets:
            - "risk-service:8002"


    - job_name: "ai-service"
      metrics_path: /metrics
      static_configs:
        - targets:
            - "ai-service:8003"


    - job_name: "report-service"
      metrics_path: /metrics
      static_configs:
        - targets:
            - "report-service:8004"


---
# =========================================================
# PROMETHEUS DEPLOYMENT
# =========================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      containers:

        - name: prometheus

          image: prom/prometheus:latest

          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=1d

          ports:
            - containerPort: 9090

          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml

          resources:
            requests:
              cpu: 50m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

      volumes:

        - name: prometheus-config

          configMap:
            name: prometheus-config


---
# =========================================================
# PROMETHEUS SERVICE
# =========================================================

apiVersion: v1
kind: Service
metadata:
  name: prometheus

spec:
  selector:
    app: prometheus

  ports:
    - port: 9090
      targetPort: 9090


---
# =========================================================
# GRAFANA DATASOURCE
# =========================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource

data:

  datasource.yaml: |

    apiVersion: 1

    datasources:

      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false


---
# =========================================================
# GRAFANA DEPLOYMENT
# =========================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:

      containers:

        - name: grafana

          image: grafana/grafana:latest

          ports:
            - containerPort: 3000

          env:

            - name: GF_SECURITY_ADMIN_USER
              value: admin

            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin

            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"

            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"

          volumeMounts:

            - name: grafana-datasource
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml

          resources:

            requests:
              cpu: 50m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi


      volumes:

        - name: grafana-datasource

          configMap:
            name: grafana-datasource


---
# =========================================================
# GRAFANA SERVICE
# =========================================================

apiVersion: v1
kind: Service
metadata:
  name: grafana

spec:
  selector:
    app: grafana

  ports:
    - port: 3000
      targetPort: 3000