upstream frontend {
    server frontend:80;
}

upstream api_gateway {
    server api-gateway:8000;
}

server {
    listen 80;
    server_name incendios-valparaiso.brazilsouth.cloudapp.azure.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name incendios-valparaiso.brazilsouth.cloudapp.azure.com;

    ssl_certificate /etc/letsencrypt/live/incendios-valparaiso.brazilsouth.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/incendios-valparaiso.brazilsouth.cloudapp.azure.com/privkey.pem;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://api_gateway/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://api_gateway/openapi.json;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
